[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-driving-agent"
version = "0.1.0"
description = "A toy real-time vehicle decision agent built on the Jev (TypeSafe System One) API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-driving-agent = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
